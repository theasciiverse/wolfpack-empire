# Builds the Wolfpack Empire client for the Asciiverse catalog: one archive
# per target, named <id>-<target>.tar.gz (Linux, macOS) or .zip (Windows),
# plus a SHA256SUMS file, attached to a GitHub release
# (hub/catalog/SCHEMA.md, release.source = "github"). Runs on a pushed v*
# tag, or by hand for an existing tag.
#
# Only the client is built; the game itself runs on Wolfpack's servers.
# Its compiled-in default is the Wolfpack Fever game
# (blitz.wolfpackempire.com:4567), so a plain `empire` connects there.
#
# The version would come from git describe, which counts the commits since
# v4.4.1. The release code is upstream's v4.4.1 (the one later upstream
# commit only touches doc/contributing), so make is told version=4.4.1.
#
# Linux builds run in Alpine and link readline and ncurses statically
# (-musl). macOS links the system's ncurses and readline (libedit), and
# fails if anything from Homebrew sneaks in. Windows is cross-compiled
# with MinGW, as upstream's own Windows client (no readline there).

name: asciiverse-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "existing tag to build and release"
        required: true

env:
  ID: wolfpack-empire
  BIN: empire
  VERSION: "4.4.1"
  TAG: ${{ inputs.tag || github.ref_name }}
  DEFAULTS: EMPIREHOST=blitz.wolfpackempire.com EMPIREPORT=4567

permissions:
  contents: write

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build
        run: |
          docker run --rm -e DEFAULTS -e VERSION -v "$PWD":/src -w /src alpine:3.22 sh -c '
            apk add --no-cache build-base autoconf automake perl groff git \
              readline-dev readline-static ncurses-dev ncurses-static &&
            git config --global --add safe.directory /src &&
            ./bootstrap &&
            ./configure $DEFAULTS LDFLAGS="-static -s" LIBS=-lncursesw &&
            make src/client/empire version=$VERSION'
          file "src/client/$BIN"
          "src/client/$BIN" -v | head -1

      - name: Package
        run: |
          # the binary sits at the top of the archive, where av looks for it
          mkdir -p stage dist
          cp "src/client/$BIN" src/client/README COPYING stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-apple-darwin, runner: macos-15-intel }
          - { target: aarch64-apple-darwin, runner: macos-15 }
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Tools
        run: brew install autoconf automake

      - name: Build
        run: |
          ./bootstrap
          ./configure $DEFAULTS
          make src/client/empire version=$VERSION
          strip "src/client/$BIN"
          file "src/client/$BIN"
          otool -L "src/client/$BIN"
          if otool -L "src/client/$BIN" | grep -E '/usr/local/|/opt/homebrew/'; then
            echo "links a library that only exists on this runner" >&2; exit 1
          fi
          "src/client/$BIN" -v | head -1

      - name: Package
        run: |
          mkdir -p stage dist
          cp "src/client/$BIN" src/client/README COPYING stage/
          tar -czf "dist/$ID-${{ matrix.target }}.tar.gz" -C stage .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  windows:
    runs-on: ubuntu-24.04
    env:
      TARGET: x86_64-pc-windows-gnu
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - name: Build
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-mingw-w64-x86-64 autoconf automake groff-base
          ./bootstrap
          ./configure --host=x86_64-w64-mingw32 $DEFAULTS LDFLAGS="-static -s"
          make src/client/empire.exe version=$VERSION
          file "src/client/$BIN.exe"

      - name: Package
        run: |
          mkdir -p stage dist
          cp "src/client/$BIN.exe" src/client/README COPYING stage/
          (cd stage && zip -r "../dist/$ID-$TARGET.zip" .)

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.TARGET }}
          path: dist/*

  release:
    needs: [linux, macos, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "Wolfpack Empire client $TAG" \
                 --notes "The Wolfpack Empire $VERSION client from git.pond.sub.org/empire/empserver, built for the Asciiverse catalog. It connects to the Wolfpack Fever game by default."
          gh release upload "$TAG" dist/* -R "$GITHUB_REPOSITORY" --clobber
